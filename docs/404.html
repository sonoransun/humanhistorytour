<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in time — Human History Tour</title>
<meta name="robots" content="noindex">
<!-- 404 is served at arbitrary URL depths, so styles are INLINED and links are
     absolute. Update the host below if publishing under a different account. -->
<link rel="icon" href="https://sonoransun.github.io/humanhistorytour/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..640&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(80% 60% at 50% 0%, #2a1a13, #100c0a 70%);
    color: #e8dfd3; font-family: "IBM Plex Mono", ui-monospace, monospace;
    padding: 2rem;
  }
  .wrap { max-width: 40rem; }
  .rail { display: flex; gap: 4px; justify-content: center; margin-bottom: 2rem; }
  .rail span { width: 26px; height: 6px; border-radius: 99px; opacity: .8; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: clamp(3rem, 12vw, 7rem); font-weight: 440; line-height: .95; letter-spacing: -.02em; }
  p.lede { font-family: "Fraunces", Georgia, serif; font-size: 1.4rem; margin-top: 1rem; color: #c9bfb0; }
  p.sub { margin-top: 1.2rem; color: #9c9184; font-size: .9rem; letter-spacing: .02em; }
  .links { margin-top: 2rem; display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    text-decoration: none; color: #140f0c; background: #c1502e;
    padding: .7rem 1.15rem; border-radius: 99px; font-size: .8rem;
    text-transform: uppercase; letter-spacing: .06em;
  }
  a.btn.ghost { color: #e8dfd3; background: transparent; border: 1px solid #4a4038; }
  a.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="rail" aria-hidden="true">
      <span style="background:#c1502e"></span><span style="background:#cf6a3c"></span>
      <span style="background:#d9a441"></span><span style="background:#4f86c6"></span>
      <span style="background:#5b8fc4"></span><span style="background:#d0ab34"></span>
      <span style="background:#c25236"></span><span style="background:#ef6a3d"></span>
      <span style="background:#22d3ee"></span>
    </div>
    <h1>404</h1>
    <p class="lede">You have wandered off the timeline.</p>
    <p class="sub">This moment is not among the seven million years we have mapped. Let&rsquo;s get you back on the thread.</p>
    <div class="links">
      <a class="btn" href="https://sonoransun.github.io/humanhistorytour/">Return to the start</a>
      <a class="btn ghost" href="https://sonoransun.github.io/humanhistorytour/tour/01-deep-prehistory.html">Begin the tour</a>
      <a class="btn ghost" href="https://sonoransun.github.io/humanhistorytour/reference/master-timeline.html">Master timeline</a>
    </div>
  </div>
</body>
</html>
